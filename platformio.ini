[platformio]
default_envs = wand_c3

[base]
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    thomasfredericks/Bounce2 @ ^2.72.0

[env:esp32dev]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
; 1.9 MB app slots (two, so Wi-Fi OTA still works) for the Bluetooth stack.
; NVS keeps its offset, so saved settings survive. Change it only over USB.
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<main.cpp>
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    ${base.lib_deps}
    esp32async/ESPAsyncWebServer @ ^3.7.0
build_flags =
    ; Keep the web server task off core 0, where I2S output and the SD reader run.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    ; 8 KB instead of the 16 KB default to leave RAM for the SD mixer (GPStar uses 4 KB).
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192

; Pack firmware over the pack's Wi-Fi: join its network, then
; pio run -e pack_ota -t upload
[env:pack_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
extra_scripts = pre:scripts/ota_auth.py

[env:pack_audio_test]
extends = env:esp32dev
build_src_filter = -<*> +<pack_audio_test.cpp>

; Simple pack firmware (second build, third ESP32; separate from the main pack).
; Uploads only to the simple-pack board (MAC check in scripts/require_mac.py).
[env:simple_pack]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<simple_pack.cpp>
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    ${base.lib_deps}
    esp32async/ESPAsyncWebServer @ ^3.7.0
build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
extra_scripts = post:scripts/require_mac.py
custom_required_mac = 04:b2:47:92:12:8c

; Simple pack firmware over its own Wi-Fi (192.168.5.1, never the main pack's
; 192.168.4.1): join the simple pack's network, then pio run -e simple_pack_ota -t upload
[env:simple_pack_ota]
extends = env:simple_pack
upload_protocol = espota
upload_port = 192.168.5.1
extra_scripts = pre:scripts/ota_auth.py

; Simple pack bring-up on the third ESP32 (not the main pack): NeoPixel chain test.
[env:simple_pixel_test]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<simple_pixel_test.cpp>
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:wand_c3]
extends = env:esp32dev
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_src_filter = -<*> +<wand.cpp>
lib_deps =
    ${base.lib_deps}
    lpaseen/simple ht16k33 library @ ^1.0.3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0

[env:bargraph_scan_c3]
extends = env:wand_c3
build_src_filter = -<*> +<bargraph_scan.cpp>

[env:native]
platform = native @ ^1.2.1
test_framework = unity
test_build_src = no
test_filter = test_pack